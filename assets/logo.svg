<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Emblem / Monogram -->
  <g transform="translate(20, 15)">
    <!-- Circuit backdrop circle -->
    <circle cx="55" cy="55" r="50" fill="none" stroke="url(#neonGradient)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
    <circle cx="55" cy="55" r="42" fill="#0d1117" stroke="#1f2937" stroke-width="2" />
    
    <!-- Neon Neural Links -->
    <line x1="28" y1="42" x2="55" y2="25" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="55" y1="25" x2="82" y2="42" stroke="#a855f7" stroke-width="1" opacity="0.6" />
    <line x1="40" y1="78" x2="55" y2="55" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <line x1="55" y1="55" x2="70" y2="78" stroke="#a855f7" stroke-width="1" opacity="0.6" />
    <circle cx="55" cy="25" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="28" cy="42" r="2.5" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="82" cy="42" r="2.5" fill="#c084fc" filter="url(#softGlow)" />

    <!-- Stylized 'M' and 'V' Interlocking Polygons -->
    <path d="M 32 80 L 32 35 L 48 58 L 55 45 L 62 58 L 78 35 L 78 80 L 68 80 L 68 56 L 55 75 L 42 56 L 42 80 Z" 
          fill="url(#neonGradient)" filter="url(#glow)" opacity="0.95" />
    <path d="M 50 65 L 55 73 L 60 65 L 67 75 L 55 92 L 43 75 Z" 
          fill="url(#neonGradient)" />
    <!-- Core Spark -->
    <circle cx="55" cy="52" r="3" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Typography: MV.ai -->
  <text x="145" y="76" font-family="'Inter', 'Poppins', system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#neonGradient)" letter-spacing="-1.5" filter="url(#softGlow)">
    MV<tspan fill="#f59e0b">.</tspan><tspan fill="#ffffff" font-size="44" font-weight="800">ai</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="148" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="3.5" text-transform="uppercase">
    Crie Sites &amp; E-books com IA
  </text>

  <!-- VIP / Free Badge -->
  <g transform="translate(410, 36)">
    <rect width="68" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
    <text x="34" y="15" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#34d399" text-anchor="middle" letter-spacing="1">GRÁTIS</text>
  </g>
</svg>
